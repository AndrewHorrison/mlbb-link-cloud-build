name: Build MLBB Link APKs

on:
  workflow_dispatch:
  push:
    paths:
      - 'MLBB-Link-MVP.tar.gz'
      - '.github/workflows/android-build.yml'
      - 'patch_project.py'
      - 'overrides/bridge/MainActivity.java'
      - 'scripts/**'

permissions:
  contents: write

jobs:
  build:
    name: Build Phone Controller and Waydroid Bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        run: |
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 https://services.gradle.org/distributions/gradle-8.9-bin.zip -o "$RUNNER_TEMP/gradle-8.9-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.9-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Extract source and apply UI/network fixes
        run: |
          set -euo pipefail
          test -s MLBB-Link-MVP.tar.gz
          mkdir -p source
          tar -xzf MLBB-Link-MVP.tar.gz -C source
          test -d source/mlbb-link/waydroid-touch-bridge
          test -d source/mlbb-link/phone-controller
          test -f source/mlbb-link/host/mlbb_link_host.py
          python3 patch_project.py source/mlbb-link
          cp overrides/bridge/MainActivity.java source/mlbb-link/waydroid-touch-bridge/app/src/main/java/com/mlbblink/bridge/MainActivity.java
          python3 -m py_compile source/mlbb-link/host/mlbb_link_host.py

      - name: Bundle real hero skill artwork
        run: |
          set -euo pipefail
          assets="source/mlbb-link/phone-controller/app/src/main/res/drawable-nodpi"
          mkdir -p "$assets"
          base="https://mlbb.mezes.uz/img/skills"
          curl -fL --retry 5 --retry-all-errors "$base/nana__skill1-100.webp" -o "$assets/skill_nana_1.webp"
          curl -fL --retry 5 --retry-all-errors "$base/nana__skill2-100.webp" -o "$assets/skill_nana_2.webp"
          curl -fL --retry 5 --retry-all-errors "$base/nana__ultimate-100.webp" -o "$assets/skill_nana_3.webp"
          curl -fL --retry 5 --retry-all-errors "$base/dyrroth__skill1-100.webp" -o "$assets/skill_dyrroth_1.webp"
          curl -fL --retry 5 --retry-all-errors "$base/dyrroth__skill2-100.webp" -o "$assets/skill_dyrroth_2.webp"
          curl -fL --retry 5 --retry-all-errors "$base/dyrroth__ultimate-100.webp" -o "$assets/skill_dyrroth_3.webp"
          curl -fL --retry 5 --retry-all-errors "$base/sora__skill1-100.webp" -o "$assets/skill_sora_1.webp"
          curl -fL --retry 5 --retry-all-errors "$base/sora__skill2-100.webp" -o "$assets/skill_sora_2.webp"
          curl -fL --retry 5 --retry-all-errors "$base/sora__ultimate-100.webp" -o "$assets/skill_sora_3.webp"
          file "$assets"/*.webp
          test "$(find "$assets" -maxdepth 1 -name '*.webp' | wc -l)" -eq 9

      - name: Bundle additional hero artwork
        run: |
          set -euo pipefail
          assets="source/mlbb-link/phone-controller/app/src/main/res/drawable-nodpi"
          base="https://mlbb.mezes.uz/img/skills"
          for hero in miya layla alucard tigreal gusion fanny alice saber balmond eudora zilong franco akai karina clint bruno bane; do
            for spec in "skill1:1" "skill2:2" "ultimate:3"; do
              source_name="$(printf '%s' "$spec" | cut -d: -f1)"
              skill_no="$(printf '%s' "$spec" | cut -d: -f2)"
              target="$assets/skill_${hero}_${skill_no}.webp"
              tmp="$target.tmp"
              if curl -fLsS --retry 2 --connect-timeout 10 "$base/${hero}__${source_name}-100.webp" -o "$tmp"; then
                mv "$tmp" "$target"
              else
                rm -f "$tmp" "$target"
                echo "Optional artwork not found for $hero $source_name; fallback glyph will be used"
              fi
            done
          done
          echo "Additional hero artwork fetch finished"

      - name: Bundle hero portrait icons
        run: |
          set -euo pipefail
          assets="source/mlbb-link/phone-controller/app/src/main/res/drawable-nodpi"
          mkdir -p "$assets"
          for hero in nana dyrroth sora miya layla alucard tigreal gusion fanny alice saber balmond eudora zilong franco akai karina clint bruno bane; do
            ext=png
            case "$hero" in
              nana) url="https://raw.githubusercontent.com/Lara3924/Lara_Image/main/Nana%20-%20Hero051.png" ;;
              dyrroth) url="https://raw.githubusercontent.com/Lara3924/Lara_Image/main/Dyrroth%20-%20Hero851.png" ;;
              miya) url="https://raw.githubusercontent.com/Lara3924/Lara_Image/main/Miya%20-%20Hero011.png" ;;
              layla) url="https://raw.githubusercontent.com/Lara3924/Lara_Image/main/Layla%20-%20Hero181.png" ;;
              alucard) url="https://raw.githubusercontent.com/Lara3924/Lara_Image/main/Alucard%20-%20Hero071.png" ;;
              tigreal) url="https://raw.githubusercontent.com/Lara3924/Lara_Image/main/Tigreal%20-%20Hero061.png" ;;
              gusion) url="https://raw.githubusercontent.com/Lara3924/Lara_Image/main/Gusion%20-%20Hero561.png" ;;
              fanny) url="https://raw.githubusercontent.com/Lara3924/Lara_Image/main/Fanny%20-%20Hero171.png" ;;
              sora) url="https://static-cdn.manabuy.com/wz_20250324103741/mlbb_20250324135329/lantern-rite-2026-genshin-impact-skins-free-rewards-details_20251217113220/sora_hero_202512171134_webp.webp"; ext=webp ;;
              alice) url="https://raw.githubusercontent.com/Lara3924/Lara_Image/main/Alice%20-%20Hero041.png" ;;
              saber) url="https://raw.githubusercontent.com/Lara3924/Lara_Image/main/Saber%20-%20Hero031.png" ;;
              balmond) url="https://raw.githubusercontent.com/Lara3924/Lara_Image/main/Balmond%20-%20Hero021.png" ;;
              eudora) url="https://raw.githubusercontent.com/Lara3924/Lara_Image/main/Eudora%20-%20Hero151.png" ;;
              zilong) url="https://raw.githubusercontent.com/Lara3924/Lara_Image/main/Zilong%20-%20Hero161.png" ;;
              franco) url="https://raw.githubusercontent.com/Lara3924/Lara_Image/main/Franco%20-%20Hero101.png" ;;
              akai) url="https://raw.githubusercontent.com/Lara3924/Lara_Image/main/Akai%20-%20Hero091.png" ;;
              karina) url="https://raw.githubusercontent.com/Lara3924/Lara_Image/main/Karina%20-%20Hero081.png" ;;
              clint) url="https://raw.githubusercontent.com/Lara3924/Lara_Image/main/Clint%20-%20Hero131.png" ;;
              bruno) url="https://raw.githubusercontent.com/Lara3924/Lara_Image/main/Bruno%20-%20Hero121.png" ;;
              bane) url="https://raw.githubusercontent.com/Lara3924/Lara_Image/main/Bane%20-%20Hero111.png" ;;
            esac
            target="$assets/hero_$hero.$ext"
            tmp="$target.tmp"
            if curl -fLsS --retry 2 --connect-timeout 10 "$url" -o "$tmp"; then
              mv "$tmp" "$target"; echo "Downloaded $hero portrait"
            else
              rm -f "$tmp" "$target"; echo "Portrait unavailable for $hero; initials fallback will be used"
            fi
          done
      - name: Complete and normalize all hero portraits
        run: |
          set -euo pipefail
          assets="source/mlbb-link/phone-controller/app/src/main/res/drawable-nodpi"
          mkdir -p "$assets"
          python3 -m pip install --quiet Pillow
          curl -fLsS --retry 3 "https://raw.githubusercontent.com/Ceplin03/database-mlbb.Mobile-Legends-Bang-Bang/master/hero.json" -o "$RUNNER_TEMP/mlbb-heroes.json"
          python3 - "$assets" "$RUNNER_TEMP/mlbb-heroes.json" <<'PYCODE'
          import concurrent.futures, json, re, sys, urllib.request
          from pathlib import Path
          from io import BytesIO
          from PIL import Image, ImageOps, ImageDraw
          out=Path(sys.argv[1]); rows=json.loads(Path(sys.argv[2]).read_text())
          special={"Chang'e":"change","Popol and Kupa":"popol_and_kupa","X.Borg":"x_borg","Yi Sun-shin":"yi_sun_shin","Lapu-Lapu":"lapu_lapu","Luo Yi":"luo_yi"}
          def key(name): return special.get(name,re.sub(r"[^a-z0-9]+","_",name.lower()).strip("_"))
          def dl(row):
              name=row.get("name_hero",""); image=row.get("images-hero","")
              k=key(name); target=out/f"hero_{k}.webp"
              if target.exists() or any((out/f"hero_{k}.{ext}").exists() for ext in ("png","jpg","jpeg")): return "exists "+name
              if not image: return "no image "+name
              url="https://raw.githubusercontent.com/Ceplin03/database-mlbb.Mobile-Legends-Bang-Bang/master/images-hero/"+image.replace(" ","%20")
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"MLBB-Link-build"})
                  raw=urllib.request.urlopen(req,timeout=12).read()
                  im=Image.open(BytesIO(raw)).convert("RGB")
                  # Center-crop portrait image to square and resize for lightweight icon assets.
                  im=ImageOps.fit(im,(256,256),method=Image.Resampling.LANCZOS,centering=(0.5,0.45))
                  im.save(target,"WEBP",quality=88,method=6)
                  return "ok "+name
              except Exception as e: return "fallback "+name+": "+str(e)
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex:
              for result in ex.map(dl,rows): print(result)
          # Crop existing Sora banner around the character on its right-hand side.
          for src in (out/"hero_sora.webp",out/"hero_sora.png"):
              if src.exists():
                  try:
                      im=Image.open(src).convert("RGB")
                      if im.width > im.height*1.25: im=im.crop((int(im.width*0.43),0,im.width,im.height))
                      im=ImageOps.fit(im,(256,256),method=Image.Resampling.LANCZOS,centering=(0.5,0.48))
                      im.save(out/"hero_sora.webp","WEBP",quality=90,method=6)
                      if src.suffix.lower() != ".webp": src.unlink(missing_ok=True)
                  except Exception as e: print("Sora crop skipped:",e)
          # No network asset is guaranteed for Hirara/newer roster, app draws an initials fallback.
          PYCODE

      - name: Generate separate Sora Thunder and Torrent skill icons
        run: |
          set -euo pipefail
          assets="source/mlbb-link/phone-controller/app/src/main/res/drawable-nodpi"
          python3 -m pip install --quiet Pillow
          python3 - "$assets" <<'PYCODE'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw
          import sys
          out=Path(sys.argv[1])
          for form in ("thunder","torrent"):
            for i in range(1,4):
              src=out/f"skill_sora_{i}.webp"
              if not src.exists():
                # Always generate a legible icon even if the upstream source artwork is unavailable.
                im=Image.new("RGB",(128,128),(18,36,54))
              else:
                im=Image.open(src).convert("RGB")
              im=ImageOps.fit(im,(128,128),method=Image.Resampling.LANCZOS)
              overlay=Image.new("RGBA",(128,128),(0,0,0,0)); d=ImageDraw.Draw(overlay)
              if form=="thunder":
                d.ellipse((6,6,122,122),outline=(97,230,255,255),width=5)
                d.polygon([(70,14),(38,70),(62,70),(49,112),(94,55),(69,55)],fill=(120,238,255,235))
                tag=(25,120,173,245)
              else:
                d.ellipse((6,6,122,122),outline=(113,244,205,255),width=5)
                for yy in (44,64,84):
                  d.arc((25,yy-12,108,yy+12),190,350,fill=(105,255,219,255),width=6)
                tag=(18,132,111,245)
              d.rounded_rectangle((12,10,70,31),radius=7,fill=tag)
              d.text((18,13),form.upper(),fill=(255,255,255,255),stroke_width=0)
              im=Image.alpha_composite(im.convert("RGBA"),overlay).convert("RGB")
              im.save(out/f"sora_{form}_{i}.webp","WEBP",quality=90,method=6)
          print("Generated all 6 Sora form skill icons")
          PYCODE

      - name: Bundle authentic battle-spell artwork
        run: |
          set -euo pipefail
          assets="source/mlbb-link/phone-controller/app/src/main/res/drawable-nodpi"
          mkdir -p "$assets"
          base="https://mlbb.mezes.uz/img/spells"
          for spell in flicker retribution purify sprint execute petrify inspire aegis vengeance flameshot arrival revitalize; do
            curl -fL --retry 5 --retry-all-errors "$base/$spell-100.webp" -o "$assets/spell_$spell.webp"
          done
          file "$assets"/spell_*.webp
          test "$(find "$assets" -maxdepth 1 -name 'spell_*.webp' | wc -l)" -eq 12

      - name: Ensure microphone permission is declared
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path("source/mlbb-link/phone-controller/app/src/main/AndroidManifest.xml")
          text = p.read_text()
          permission = '    <uses-permission android:name="android.permission.RECORD_AUDIO" />'
          if "android.permission.RECORD_AUDIO" not in text:
              pos = text.find(">")
              if pos < 0:
                  raise SystemExit("Android manifest opening tag not found")
              text = text[:pos + 1] + chr(10) + permission + text[pos + 1:]
              p.write_text(text)
          print("Microphone permission verified")
          PYCODE

      - name: Patch touch-coordinate float conversion if needed
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path("source/mlbb-link/waydroid-touch-bridge/app/src/main/java/com/mlbblink/bridge/TouchAccessibilityService.java")
          text = p.read_text()
          old = 'tap(screenPoint(o.optDouble("x",0.5),o.optDouble("y",0.5)));'
          new = 'tap(screenPoint((float)o.optDouble("x",0.5),(float)o.optDouble("y",0.5)));'
          if old in text:
              p.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit("Expected touch-coordinate handler not found")
          PYCODE

      - name: Apply MLBB Link v0.9 transport and full-roster source patch
        run: |
          set -euo pipefail
          test -s .feature-patch/v09.patch.gz.b64
          base64 -d .feature-patch/v09.patch.gz.b64 | gzip -d > "$RUNNER_TEMP/mlbb-link-v09.patch"
          patch --batch --forward -p1 -d source/mlbb-link < "$RUNNER_TEMP/mlbb-link-v09.patch"
          # Ensure the final legacy rows are comma-separated from generated generic rows.
          python3 - <<'PYFIX'
          from pathlib import Path
          p = Path("source/mlbb-link/phone-controller/app/src/main/java/com/mlbblink/controller/MainActivity.java")
          s = p.read_text()
          s = s.replace('{"CRAB CLAW CANNON", "ALE", "DEADLY CATCH"}\n                {"SKILL 1",',
                        '{"CRAB CLAW CANNON", "ALE", "DEADLY CATCH"},\n                {"SKILL 1",', 1)
          s = s.replace('{6000, 9000, 40000}\n                {7000, 9000, 35000}',
                        '{6000, 9000, 40000},\n                {7000, 9000, 35000}', 1)
          p.write_text(s)
          # BluetoothSocket exposes isConnected(), but not isClosed().
          s = p.read_text()
          s = s.replace("btSocket.isConnected() && !btSocket.isClosed() && btWriter != null",
                        "btSocket.isConnected() && btWriter != null", 1)
          p.write_text(s)
          # Only exclude known Podman/Docker bridge ranges, not all RFC1918 172.16/12 LANs.
          host_path = Path("source/mlbb-link/host/mlbb_link_host.py")
          host_source = host_path.read_text()
          host_source = host_source.replace(
              'ipaddress.ip_network("172.16.0.0/12"),',
              'ipaddress.ip_network("172.17.0.0/16"),\n        ipaddress.ip_network("172.18.0.0/16"),\n        ipaddress.ip_network("172.19.0.0/16"),', 1)
          host_path.write_text(host_source)
          for gradle_path in (
              Path("source/mlbb-link/phone-controller/app/build.gradle"),
              Path("source/mlbb-link/waydroid-touch-bridge/app/build.gradle"),
          ):
              gradle = gradle_path.read_text()
              if "buildFeatures { buildConfig true }" not in gradle:
                  gradle = gradle.replace("android {", "android { buildFeatures { buildConfig true };", 1)
                  gradle_path.write_text(gradle)
          PYFIX
          python3 -m py_compile source/mlbb-link/host/mlbb_link_host.py
          python3 - <<'PYCODE'
          from pathlib import Path
          root = Path("source/mlbb-link")
          phone = (root / "phone-controller/app/src/main/java/com/mlbblink/controller/MainActivity.java").read_text()
          host = (root / "host/mlbb_link_host.py").read_text()
          for marker in ("private void cycleConnectionMode", "checkForUpdates", "BT BETA", "DUAL"):
              if marker not in phone: raise SystemExit("Expected v0.9 controller feature missing: " + marker)
          if "start_tcp_control_server" not in host: raise SystemExit("USB TCP host relay missing")
          import re
          for p in (root/"phone-controller/app/build.gradle", root/"waydroid-touch-bridge/app/build.gradle"):
              gradle = p.read_text()
              gradle = re.sub(r"versionCode\s+\d+", "versionCode 12", gradle, count=1)
              gradle = re.sub(r"versionName\s+'[^']+'", "versionName '0.10.0'", gradle, count=1)
              p.write_text(gradle)
              if "versionCode 12" not in gradle or "0.10.0" not in gradle:
                  raise SystemExit("Unexpected app version in " + str(p))
          print("v0.10.0 source patch applied and app versions bumped")
          PYCODE

      - name: Enrich every hero skill icon and add skill descriptions
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow
          python3 scripts/enrich_hero_skills.py \
            source/mlbb-link/phone-controller \
            source/mlbb-link/phone-controller/app/src/main/java/com/mlbblink/controller/MainActivity.java
          python3 -m py_compile source/mlbb-link/host/mlbb_link_host.py scripts/enrich_hero_skills.py
          python3 - <<'PYCODE'
          import json, re
          from pathlib import Path
          root = Path("source/mlbb-link")
          app = root / "phone-controller/app"
          java_path = app / "src/main/java/com/mlbblink/controller/MainActivity.java"
          java = java_path.read_text()
          def array_values(declaration):
              match = re.search(declaration + r"\s*=\s*(\{.*?\});", java, re.S)
              if not match: raise SystemExit("Missing Java table " + declaration)
              return json.loads("[" + match.group(1)[1:-1] + "]")
          heroes = array_values(r"private final String\[\] heroes")
          keys = array_values(r"String\[\] keys")
          if len(heroes) != len(keys): raise SystemExit("Hero/key count mismatch")
          icons = app / "src/main/res/drawable-nodpi"
          missing = [f"{key}:S{slot}" for key in keys for slot in (1,2,3) if not (icons / f"skill_{key}_{slot}.webp").is_file()]
          if missing: raise SystemExit("Missing skill icon resources: " + ", ".join(missing[:20]))
          details_path = app / "src/main/assets/hero_skill_details.json"
          if not details_path.is_file(): raise SystemExit("Skill details JSON is missing from app assets")
          details = json.loads(details_path.read_text())
          if len(details.get("heroes", [])) != len(heroes): raise SystemExit("Skill metadata roster count mismatch")
          if "private void loadSkillDetails()" not in java or "skillDescriptions[heroIndex][aimSkill]" not in java:
              raise SystemExit("Skill descriptions are not connected to the aiming overlay")
          variant_missing = [f"sora_{form}_{i}" for form in ("thunder","torrent") for i in (1,2,3)
                             if not (icons / f"sora_{form}_{i}.webp").is_file()]
          if variant_missing: raise SystemExit("Missing Sora form icons: " + ", ".join(variant_missing))
          print(f"Verified {len(heroes)} hero entries, {len(heroes)*3} skill icons, skill details, and all Sora form icons")
          PYCODE

      - name: Reuse stable beta signing key for future app updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" "$RUNNER_TEMP/mlbb-link-key"
          if gh release view mlbb-link-beta >/dev/null 2>&1; then
            gh release download mlbb-link-beta --pattern MLBB-Link-Debug.keystore --dir "$RUNNER_TEMP/mlbb-link-key" || true
          fi
          if [[ -s "$RUNNER_TEMP/mlbb-link-key/MLBB-Link-Debug.keystore" ]]; then
            cp "$RUNNER_TEMP/mlbb-link-key/MLBB-Link-Debug.keystore" "$HOME/.android/debug.keystore"
            cp "$HOME/.android/debug.keystore" "$RUNNER_TEMP/MLBB-Link-Debug.keystore"
            echo "Reused stable v0.9+ signing key."
          else
            keytool -genkeypair -noprompt -v \
              -keystore "$HOME/.android/debug.keystore" -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=MLBB Link Debug,O=MLBB Link,C=US"
            cp "$HOME/.android/debug.keystore" "$RUNNER_TEMP/MLBB-Link-Debug.keystore"
            echo "Created first stable signing key; it will be stored as a private beta release asset."
          fi

      - name: Build Waydroid Touch Bridge APK
        working-directory: source/mlbb-link/waydroid-touch-bridge
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle --no-daemon --stacktrace assembleDebug

      - name: Build Phone Controller APK
        working-directory: source/mlbb-link/phone-controller
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare installable APKs and updated source
        run: |
          set -euo pipefail
          mkdir -p output
          cp source/mlbb-link/waydroid-touch-bridge/app/build/outputs/apk/debug/app-debug.apk output/MLBB-Link-Touch-Bridge.apk
          cp source/mlbb-link/phone-controller/app/build/outputs/apk/debug/app-debug.apk output/MLBB-Link-Phone-Controller.apk
          cp source/mlbb-link/host/mlbb_link_host.py output/mlbb_link_host.py
          tar -czf output/MLBB-Link-Updated-Source.tar.gz -C source mlbb-link
          cd output
          sha256sum MLBB-Link-Touch-Bridge.apk MLBB-Link-Phone-Controller.apk > SHA256SUMS.txt
          zip -q MLBB-Link-APKs.zip MLBB-Link-Touch-Bridge.apk MLBB-Link-Phone-Controller.apk SHA256SUMS.txt

      - name: Publish rolling beta and refresh update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          phone="output/MLBB-Link-Phone-Controller.apk"
          bridge="output/MLBB-Link-Touch-Bridge.apk"
          keystore="$RUNNER_TEMP/MLBB-Link-Debug.keystore"
          if gh release view mlbb-link-beta >/dev/null 2>&1; then
            gh release upload mlbb-link-beta "$phone" "$bridge" "$keystore" --clobber
          else
            gh release create mlbb-link-beta "$phone" "$bridge" "$keystore" --prerelease --title "MLBB Link Beta" --notes "Rolling prerelease builds. Bluetooth is experimental; test USB/Dual failover in practice mode."
          fi
          mkdir -p updates
          python3 - source/mlbb-link/phone-controller/app/build.gradle > updates/latest.json <<'PYCODE'
          import json,re,sys
          from pathlib import Path
          text=Path(sys.argv[1]).read_text()
          code=re.search(r"versionCode\s+(\d+)",text)
          name=re.search(r"versionName\s+'([^']+)'",text)
          if not code or not name: raise SystemExit("Could not read Android app version")
          print(json.dumps({
            "versionCode":int(code.group(1)),
            "versionName":name.group(1),
            "phoneApkUrl":"https://github.com/augustinejacyandrew-lgtm/mlbb-link-cloud-build/releases/download/mlbb-link-beta/MLBB-Link-Phone-Controller.apk",
            "bridgeApkUrl":"https://github.com/augustinejacyandrew-lgtm/mlbb-link-cloud-build/releases/download/mlbb-link-beta/MLBB-Link-Touch-Bridge.apk",
            "releaseUrl":"https://github.com/augustinejacyandrew-lgtm/mlbb-link-cloud-build/releases/tag/mlbb-link-beta"
          },indent=2))
          PYCODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/latest.json
          if [[ "$GITHUB_REF_NAME" == "main" ]] && ! git diff --cached --quiet; then
            git commit -m "chore: refresh beta update manifest [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload downloads
        uses: actions/upload-artifact@v5
        with:
          name: MLBB-Link-APKs
          path: output/*
          if-no-files-found: error
          retention-days: 7
