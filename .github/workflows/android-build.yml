name: Build MLBB Link APKs

on:
  workflow_dispatch:
  push:
    paths:
      - 'MLBB-Link-MVP.tar.gz'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract project source
        run: |
          test -f MLBB-Link-MVP.tar.gz
          mkdir -p source
          tar -xzf MLBB-Link-MVP.tar.gz -C source
          test -d source/mlbb-link/waydroid-touch-bridge
          test -d source/mlbb-link/phone-controller

      - name: Patch Java float conversion for touch coordinates
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          source = Path("source/mlbb-link/waydroid-touch-bridge/app/src/main/java/com/mlbblink/bridge/TouchAccessibilityService.java")
          text = source.read_text()
          old = 'tap(screenPoint(o.optDouble("x",0.5),o.optDouble("y",0.5)));'
          new = 'tap(screenPoint((float)o.optDouble("x",0.5),(float)o.optDouble("y",0.5)));'
          if old in text:
              source.write_text(text.replace(old, new, 1))
              print("Patched double-to-float conversion in touch bridge")
          elif new in text:
              print("Touch bridge float conversion already fixed")
          else:
              raise SystemExit("Expected touch-coordinate code was not found; inspect source before building")
          PYCODE

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        run: |
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o "$RUNNER_TEMP/gradle-8.9-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.9-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build Waydroid Touch Bridge APK
        working-directory: source/mlbb-link/waydroid-touch-bridge
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          gradle --no-daemon --stacktrace assembleDebug

      - name: Build Phone Controller APK
        working-directory: source/mlbb-link/phone-controller
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare APK downloads
        run: |
          mkdir -p output
          cp source/mlbb-link/waydroid-touch-bridge/app/build/outputs/apk/debug/app-debug.apk \
             output/MLBB-Link-Touch-Bridge.apk
          cp source/mlbb-link/phone-controller/app/build/outputs/apk/debug/app-debug.apk \
             output/MLBB-Link-Phone-Controller.apk
          cd output
          sha256sum *.apk > SHA256SUMS.txt
          zip -q MLBB-Link-APKs.zip *.apk SHA256SUMS.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: MLBB-Link-APKs
          path: output/*
          if-no-files-found: error
          retention-days: 7
